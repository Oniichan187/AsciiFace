<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AsciiFace</title>
<style>
  :root {
    --bg: #0b0c0e;
    --panel: #141619;
    --line: #24272c;
    --text: #d7dae0;
    --muted: #7d838d;
    --accent: #5ee08a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; }

  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font: 600 14px/1 Consolas, "Courier New", monospace; margin: 0; letter-spacing: .04em; }
  header .stats { margin-left: auto; color: var(--muted); font-family: Consolas, monospace; }

  main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px; min-height: 0; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; grid-auto-rows: minmax(260px, 1fr); } }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .panel-head { display: flex; align-items: center; gap: 8px; padding: 8px 10px;
    border-bottom: 1px solid var(--line); min-height: 44px; flex-wrap: wrap; }
  .panel-head .title { color: var(--muted); text-transform: uppercase; font-size: 11px; letter-spacing: .08em; margin-right: auto; }
  .stage { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; background: #000; position: relative; }
  .stage video, .stage canvas { width: 100%; height: 100%; object-fit: contain; display: block; }
  .mirror { transform: scaleX(-1); }
  .msg { position: absolute; color: var(--muted); text-align: center; padding: 16px; }

  .controls { display: flex; flex-wrap: wrap; gap: 6px 16px; padding: 10px 16px;
    border-top: 1px solid var(--line); align-items: center; }
  .controls label { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); white-space: nowrap; }
  .controls output { color: var(--text); font-family: Consolas, monospace; min-width: 3ch; }
  input[type=range] { width: 100px; accent-color: var(--accent); }
  input[type=checkbox] { accent-color: var(--accent); }
  input[type=color] { width: 28px; height: 22px; border: 1px solid var(--line); background: none; padding: 0; }
  select, button { background: #1c1f23; color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 8px; font: inherit; }
  select { max-width: 260px; }
  button { cursor: pointer; }
  button:hover, select:hover { border-color: #3a3f46; }
  .toggle { color: var(--text) !important; font-weight: 600; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #555; display: inline-block; }
  .dot.on { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  .dot.wait { background: #e0b341; }
  .dot.err { background: #e5534b; }
</style>
</head>
<body>
<header>
  <h1>ASCIIFACE</h1>
  <span class="stats" id="stats">–</span>
</header>

<main>
  <section class="panel">
    <div class="panel-head">
      <span class="title">Camera</span>
      <select id="camSelect"><option>Requesting camera…</option></select>
    </div>
    <div class="stage">
      <video id="video" autoplay playsinline muted></video>
      <div class="msg" id="camMsg"></div>
    </div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <span class="title">ASCII</span>
      <label class="toggle"><input type="checkbox" id="color"> Color</label>
      <button id="vcamBtn" title="Virtual cam"><span class="dot" id="vcamDot"></span> Virtual cam</button>
      <button id="copyBtn" title="Copy current frame as plain text">Copy text</button>
      <button id="snapBtn" title="Save current frame as PNG">Save PNG</button>
    </div>
    <div class="stage">
      <canvas id="out"></canvas>
    </div>
  </section>
</main>

<div class="controls">
  <label>Charset
    <select id="charset">
      <option value=" .'`^&quot;,:;Il!i><~+_-?][}{1)(|\/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&amp;8%B@$">Detailed (70)</option>
      <option value=" .:-=+*#%@">Standard (10)</option>
      <option value=" .-:=+*oO#@">Smooth (11)</option>
      <option value=" .oO0@">Blocky (6)</option>
      <option value=" 01">Binary</option>
      <option value="ALL">All printable ASCII (95)</option>
    </select>
  </label>
  <label>Columns <input type="range" id="cols" min="40" max="320" value="160"><output id="colsOut"></output></label>
  <label>Font <input type="range" id="font" min="5" max="20" value="9"><output id="fontOut"></output></label>
  <label>Brightness <input type="range" id="bright" min="-100" max="100" value="0"><output id="brightOut"></output></label>
  <label>Contrast <input type="range" id="contrast" min="0" max="300" value="120"><output id="contrastOut"></output></label>
  <label>Gamma <input type="range" id="gamma" min="20" max="300" value="100"><output id="gammaOut"></output></label>
  <label><input type="checkbox" id="invert"> Invert</label>
  <label><input type="checkbox" id="mirror" checked> Mirror</label>
  <label>Ink <input type="color" id="ink" value="#e8e8e8"></label>
  <label>Paper <input type="color" id="paper" value="#000000"></label>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const video = $('video'), out = $('out'), octx = out.getContext('2d');
  const camSelect = $('camSelect'), camMsg = $('camMsg'), stats = $('stats');

  // Small canvas the video gets downsampled into: one pixel per ASCII cell.
  const sample = document.createElement('canvas');
  const sctx = sample.getContext('2d', { willReadFrequently: true });

  const ALL_ASCII = Array.from({ length: 95 }, (_, i) => String.fromCharCode(32 + i)).join('');
  const FONT_STACK = 'Consolas, "Courier New", "DejaVu Sans Mono", monospace';

  let stream = null;
  let glyphs = null;     // { cw, ch, masks: Uint8Array[], chars: string[] }
  let toneLUT = new Uint8Array(256);   // luminance -> adjusted luminance
  let glyphLUT = new Uint8Array(256);  // adjusted luminance -> glyph index
  let lastIdx = null, lastCols = 0, lastRows = 0;
  let cellMsg = null;   // virtual-camera frame message: 24-byte header + (glyph, r, g, b) per cell
  let imgData = null, out32 = null;

  // ---------- settings ----------
  const S = {};
  function readSettings() {
    S.cols = +$('cols').value;
    S.font = +$('font').value;
    S.bright = +$('bright').value / 100;
    S.contrast = +$('contrast').value / 100;
    S.gamma = +$('gamma').value / 100;
    S.invert = $('invert').checked;
    S.mirror = $('mirror').checked;
    S.color = $('color').checked;
    S.charset = $('charset').value === 'ALL' ? ALL_ASCII : $('charset').value;
    S.ink = hexToRgb($('ink').value);
    S.paper = hexToRgb($('paper').value);
    $('colsOut').textContent = S.cols;
    $('fontOut').textContent = S.font;
    $('brightOut').textContent = Math.round(S.bright * 100);
    $('contrastOut').textContent = S.contrast.toFixed(2);
    $('gammaOut').textContent = S.gamma.toFixed(2);
    video.classList.toggle('mirror', S.mirror);
  }
  const hexToRgb = h => [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16));

  // ---------- glyph atlas ----------
  // Rasterize each character into a cw×ch alpha mask.
  function renderMasks(chars, px, cw, ch) {
    const c = document.createElement('canvas');
    c.width = cw; c.height = ch;
    const x = c.getContext('2d', { willReadFrequently: true });
    return chars.map(char => {
      x.fillStyle = '#000'; x.fillRect(0, 0, cw, ch);
      x.font = `${px}px ${FONT_STACK}`;
      x.fillStyle = '#fff'; x.textBaseline = 'middle'; x.textAlign = 'center';
      x.fillText(char, cw / 2, ch / 2 + px * 0.04);
      const d = x.getImageData(0, 0, cw, ch).data;
      const mask = new Uint8Array(cw * ch);
      for (let i = 0; i < mask.length; i++) mask[i] = d[i * 4];
      return mask;
    });
  }

  // Keep each character's alpha mask and measure how much ink it actually uses,
  // so brightness maps onto the real visual density of the font.
  function buildGlyphs() {
    const px = Math.max(4, Math.round(S.font * (window.devicePixelRatio || 1)));
    const m = document.createElement('canvas').getContext('2d');
    m.font = `${px}px ${FONT_STACK}`;
    const cw = Math.max(2, Math.round(m.measureText('M').width));
    const ch = Math.max(4, Math.round(px * 1.18));

    const chars = Array.from(new Set(S.charset.split('')));
    const masks = renderMasks(chars, px, cw, ch);
    const items = chars.map((char, i) => {
      let sum = 0;
      for (const a of masks[i]) sum += a;
      return { char, mask: masks[i], cov: sum / (masks[i].length * 255) };
    });
    items.sort((a, b) => a.cov - b.cov);

    // Map each brightness level to the glyph whose normalized coverage is closest.
    const lo = items[0].cov, hi = items[items.length - 1].cov || 1;
    const norm = items.map(it => (it.cov - lo) / Math.max(1e-6, hi - lo));
    for (let v = 0; v < 256; v++) {
      const t = v / 255;
      let best = 0, bd = Infinity;
      for (let i = 0; i < norm.length; i++) {
        const d = Math.abs(norm[i] - t);
        if (d < bd) { bd = d; best = i; }
      }
      glyphLUT[v] = best;
    }
    glyphs = { px, cw, ch, masks: items.map(i => i.mask), chars: items.map(i => i.char), version: (glyphs?.version || 0) + 1 };
    imgData = null; // force canvas resize
  }

  function buildToneLUT() {
    for (let v = 0; v < 256; v++) {
      let t = v / 255;
      t = (t - 0.5) * S.contrast + 0.5 + S.bright;
      t = Math.min(1, Math.max(0, t));
      t = Math.pow(t, 1 / S.gamma);
      if (S.invert) t = 1 - t;
      toneLUT[v] = Math.round(t * 255);
    }
  }

  // ---------- render ----------
  let frames = 0, fpsT = performance.now(), fps = 0, renderMs = 0;

  function render() {
    if (!glyphs || video.readyState < 2 || !video.videoWidth) return;
    const t0 = performance.now();

    const { cw, ch, masks } = glyphs;
    const vw = video.videoWidth, vh = video.videoHeight;
    const cols = S.cols;
    const rows = Math.max(1, Math.round(cols * (vh / vw) * (cw / ch)));

    if (sample.width !== cols || sample.height !== rows) { sample.width = cols; sample.height = rows; }
    sctx.imageSmoothingEnabled = true;
    sctx.imageSmoothingQuality = 'high';
    sctx.save();
    if (S.mirror) { sctx.translate(cols, 0); sctx.scale(-1, 1); }
    sctx.drawImage(video, 0, 0, cols, rows);
    sctx.restore();
    const src = sctx.getImageData(0, 0, cols, rows).data;

    const W = cols * cw, H = rows * ch;
    if (!imgData || out.width !== W || out.height !== H) {
      out.width = W; out.height = H;
      imgData = octx.createImageData(W, H);
      out32 = new Uint32Array(imgData.data.buffer);
    }
    if (!lastIdx || lastIdx.length !== cols * rows) lastIdx = new Uint8Array(cols * rows);
    if (!cellMsg || cellMsg.length !== 24 + cols * rows * 4) cellMsg = new Uint8Array(24 + cols * rows * 4);
    lastCols = cols; lastRows = rows;

    const [pr, pg, pb] = S.paper;
    const [ir, ig, ib] = S.ink;
    out32.fill((255 << 24) | (pb << 16) | (pg << 8) | pr);

    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        const si = (y * cols + x) * 4;
        const r = src[si], g = src[si + 1], b = src[si + 2];
        // Rec. 709 luma
        const lum = (r * 54 + g * 183 + b * 19) >> 8;
        const gi = glyphLUT[toneLUT[lum]];
        lastIdx[y * cols + x] = gi;
        const ci = 24 + (y * cols + x) * 4;
        cellMsg[ci] = gi; cellMsg[ci + 1] = r; cellMsg[ci + 2] = g; cellMsg[ci + 3] = b;
        if (gi === 0 && glyphs.chars[0] === ' ') continue;

        let fr, fg, fb;
        if (S.color) { fr = r; fg = g; fb = b; } else { fr = ir; fg = ig; fb = ib; }

        const mask = masks[gi];
        const ox = x * cw, oy = y * ch;
        for (let py = 0, mi = 0; py < ch; py++) {
          let o = (oy + py) * W + ox;
          for (let px = 0; px < cw; px++, mi++, o++) {
            const a = mask[mi];
            if (a === 0) continue;
            const na = 255 - a;
            const R = (fr * a + pr * na) / 255 | 0;
            const G = (fg * a + pg * na) / 255 | 0;
            const B = (fb * a + pb * na) / 255 | 0;
            out32[o] = (255 << 24) | (B << 16) | (G << 8) | R;
          }
        }
      }
    }
    octx.putImageData(imgData, 0, 0);
    sendToVcam();

    renderMs = renderMs * 0.9 + (performance.now() - t0) * 0.1;
    frames++;
    const now = performance.now();
    if (now - fpsT >= 500) {
      fps = frames * 1000 / (now - fpsT); frames = 0; fpsT = now;
      stats.textContent = `${cols}×${rows} chars · ${vw}×${vh} src · ${fps.toFixed(0)} fps · ${renderMs.toFixed(1)} ms`;
    }
  }

  function frameAsText() {
    if (!lastIdx) return '';
    const lines = [];
    for (let y = 0; y < lastRows; y++) {
      let s = '';
      for (let x = 0; x < lastCols; x++) s += glyphs.chars[lastIdx[y * lastCols + x]];
      lines.push(s.replace(/\s+$/, ''));
    }
    return lines.join('\n');
  }

  // ---------- render loop ----------
  // rAF stops when the window is hidden/minimized, which would freeze the virtual cam.
  // A worker timer is not throttled, so it keeps frames flowing in the background.
  function startLoop() {
    const raf = () => { if (!document.hidden) render(); requestAnimationFrame(raf); };
    requestAnimationFrame(raf);
    const worker = new Worker(URL.createObjectURL(new Blob(
      ['setInterval(() => postMessage(0), 1000 / 30)'], { type: 'text/javascript' })));
    worker.onmessage = () => { if (document.hidden) render(); };
  }

  // ---------- virtual camera ----------
  // When served by asciiface.ps1, frames go over a local WebSocket to the "AsciiFace" camera driver.
  const VCAM_FPS = 30;
  const VCAM_URL = location.protocol === 'http:' ? `ws://${location.host}/vcam` : null;
  const VCAM_TEXT = {
    off: 'Virtual cam off – click to enable',
    connecting: 'Connecting to AsciiFace…',
    nodriver: 'Camera driver not installed – run install.cmd',
    waiting: 'Ready – select "AsciiFace" as camera in Discord, Zoom, OBS…',
    live: 'Live – an app is showing the AsciiFace camera',
    offline: 'Start AsciiFace with the launcher to use the virtual cam'
  };
  const vcamBtn = $('vcamBtn'), vcamDot = $('vcamDot');
  let vcamSize = { width: 1280, height: 720 }, vcamAtlasKey = '';
  let vcam = null, vcamEnabled = !!VCAM_URL, vcamState = 'off', vcamLastSent = 0;

  function setVcamState(state) {
    vcamState = state;
    vcamDot.className = 'dot ' + ({ live: 'on', waiting: 'wait', nodriver: 'err', offline: 'err' }[state] || '');
    vcamBtn.title = VCAM_TEXT[state];
  }

  function connectVcam() {
    if (!VCAM_URL) return setVcamState('offline');
    setVcamState('connecting');
    vcam = new WebSocket(VCAM_URL);
    vcamAtlasKey = '';   // a (re)started server needs the atlas again
    vcam.onmessage = e => {
      const st = JSON.parse(e.data);
      if (st.width) vcamSize = { width: st.width, height: st.height };
      setVcamState(st.state);
    };
    vcam.onclose = () => {
      vcam = null;
      if (!vcamEnabled) return setVcamState('off');
      setVcamState('offline');
      setTimeout(() => vcamEnabled && !vcam && connectVcam(), 2000);
    };
  }

  vcamBtn.addEventListener('click', () => {
    vcamEnabled = !vcamEnabled;
    if (vcamEnabled) connectVcam();
    else if (vcam) vcam.close();
    else setVcamState('off');
  });

  // The camera image is drawn by asciiface.ps1 at a fixed resolution: the page only sends the glyph
  // shapes once per layout and then 4 bytes per character cell, so cost doesn't grow with columns.
  function sendVcamAtlas(cols, rows) {
    const { width: VW, height: VH } = vcamSize;
    const k = Math.min(VW / (cols * glyphs.cw), VH / (rows * glyphs.ch));
    const cw = Math.max(1, Math.floor(glyphs.cw * k)), ch = Math.max(1, Math.floor(glyphs.ch * k));
    const masks = renderMasks(glyphs.chars, glyphs.px * ch / glyphs.ch, cw, ch);
    const msg = new Uint8Array(16 + masks.length * cw * ch);
    const dv = new DataView(msg.buffer);
    dv.setInt32(0, 1, true); dv.setInt32(4, cw, true); dv.setInt32(8, ch, true); dv.setInt32(12, masks.length, true);
    masks.forEach((m, i) => msg.set(m, 16 + i * cw * ch));
    vcam.send(msg);
  }

  function sendToVcam() {
    // Only spend time on this while an app is actually showing the camera.
    if (vcamState !== 'live' || !vcam || vcam.readyState !== 1 || !cellMsg) return;
    const now = performance.now();
    if (now - vcamLastSent < 1000 / VCAM_FPS - 2 || vcam.bufferedAmount > 0) return;
    vcamLastSent = now;
    const key = `${glyphs.version}|${lastCols}x${lastRows}|${vcamSize.width}x${vcamSize.height}`;
    if (key !== vcamAtlasKey) { sendVcamAtlas(lastCols, lastRows); vcamAtlasKey = key; }
    const dv = new DataView(cellMsg.buffer);
    const [ir, ig, ib] = S.ink, [pr, pg, pb] = S.paper;
    dv.setInt32(0, 2, true); dv.setInt32(4, lastCols, true); dv.setInt32(8, lastRows, true);
    dv.setInt32(12, S.color ? 1 : 0, true);
    dv.setInt32(16, ir | ig << 8 | ib << 16, true);
    dv.setInt32(20, pr | pg << 8 | pb << 16, true);
    vcam.send(cellMsg);
  }

  // ---------- camera ----------
  async function listCameras(selectedId) {
    const devices = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput' && !/asciiface|virtual cam/i.test(d.label)); // avoid feeding our own output back in
    camSelect.innerHTML = '';
    devices.forEach((d, i) => {
      const o = document.createElement('option');
      o.value = d.deviceId;
      o.textContent = d.label || `Camera ${i + 1}`;
      camSelect.appendChild(o);
    });
    if (!devices.length) {
      camSelect.innerHTML = '<option>No camera found</option>';
      return;
    }
    if (selectedId && devices.some(d => d.deviceId === selectedId)) camSelect.value = selectedId;
  }

  async function startCamera(deviceId) {
    if (stream) stream.getTracks().forEach(t => t.stop());
    camMsg.textContent = '';
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: {
          ...(deviceId ? { deviceId: { exact: deviceId } } : {}),
          width: { ideal: 1280 }, height: { ideal: 720 }
        },
        audio: false
      });
      video.srcObject = stream;
      await video.play().catch(() => {});
      const id = stream.getVideoTracks()[0]?.getSettings().deviceId;
      await listCameras(id || deviceId);
    } catch (e) {
      camMsg.textContent = `Camera error: ${e.name}${e.message ? ' – ' + e.message : ''}`;
      await listCameras(deviceId).catch(() => {});
    }
  }

  // ---------- wiring ----------
  camSelect.addEventListener('change', () => startCamera(camSelect.value));
  navigator.mediaDevices?.addEventListener?.('devicechange', () => listCameras(camSelect.value));

  const onTone = () => { readSettings(); buildToneLUT(); };
  const onGlyph = () => { readSettings(); buildGlyphs(); };
  ['bright', 'contrast', 'gamma', 'invert'].forEach(id => $(id).addEventListener('input', onTone));
  ['font', 'charset'].forEach(id => $(id).addEventListener('input', onGlyph));
  ['cols', 'mirror', 'color', 'ink', 'paper'].forEach(id => $(id).addEventListener('input', readSettings));
  window.addEventListener('resize', onGlyph); // devicePixelRatio can change between monitors

  $('copyBtn').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(frameAsText()); flash($('copyBtn'), 'Copied'); }
    catch { flash($('copyBtn'), 'Failed'); }
  });
  $('snapBtn').addEventListener('click', () => {
    const a = document.createElement('a');
    a.download = `ascii-${Date.now()}.png`;
    a.href = out.toDataURL('image/png');
    a.click();
  });
  function flash(btn, text) {
    const old = btn.textContent; btn.textContent = text;
    setTimeout(() => (btn.textContent = old), 900);
  }

  readSettings();
  buildToneLUT();
  if (document.fonts?.ready) document.fonts.ready.then(buildGlyphs); else buildGlyphs();
  buildGlyphs();
  startLoop();
  if (vcamEnabled) connectVcam(); else setVcamState(VCAM_URL ? 'off' : 'offline');

  if (!navigator.mediaDevices?.getUserMedia) {
    camMsg.textContent = 'Camera API unavailable. Start AsciiFace with the launcher (or open this file in Chrome/Edge).';
  } else {
    startCamera();
  }
})();
</script>
</body>
</html>
